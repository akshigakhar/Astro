name: Signed Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m unittest discover -s .github/scripts -p 'test_*.py'
          python .github/scripts/release_metadata.py
      - name: Decode signing keystore
        env:
          ASTRO_KEYSTORE_BASE64: ${{ secrets.ASTRO_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('ASTRO_KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Configure ASTRO_KEYSTORE_BASE64 in repository Actions secrets. See README.')
          try:
              data = base64.b64decode(value, validate=True)
          except ValueError:
              raise SystemExit('ASTRO_KEYSTORE_BASE64 is not valid single-line base64.')
          if not data:
              raise SystemExit('Decoded keystore is empty.')
          path = Path(os.environ['RUNNER_TEMP']) / 'astro-release.jks'
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600), 'wb') as stream:
              stream.write(data)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ASTRO_KEYSTORE_PATH={path}\n')
          PY
      - name: Test and build signed release
        env:
          ASTRO_KEYSTORE_PASSWORD: ${{ secrets.ASTRO_KEYSTORE_PASSWORD }}
          ASTRO_KEY_ALIAS: ${{ secrets.ASTRO_KEY_ALIAS }}
          ASTRO_KEY_PASSWORD: ${{ secrets.ASTRO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Verify signature and prepare APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/astro-${ASTRO_VERSION_NAME}.apk"
          cd dist
          sha256sum "astro-${ASTRO_VERSION_NAME}.apk" > "astro-${ASTRO_VERSION_NAME}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: astro-release-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/astro-release.jks"
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: astro-release-apk
          path: dist
      - name: Create GitHub Release with APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Astro $RELEASE_TAG" --generate-notes
